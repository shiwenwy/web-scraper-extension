<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Web Scraper</h1>
            <button id="addProjectBtn" class="btn btn-primary">
                <span class="icon">+</span>
                添加项目
            </button>
        </header>

        <div class="projects-section">
            <h2 class="section-title">我的项目</h2>
            <div id="projectsList" class="projects-list">
                <!-- 项目列表将在这里动态生成 -->
            </div>
        </div>

        <div class="current-project-section" id="currentProjectSection" style="display: none;">
            <h2 class="section-title">当前项目</h2>
            <div class="project-info">
                <span id="currentProjectName" class="project-name"></span>
                <div class="project-actions">
                    <button id="runOnceBtn" class="btn btn-success">
                        <span class="icon">▶</span>
                        运行一次
                    </button>
                    <button id="toggleAutoBtn" class="btn btn-secondary">
                        <span class="icon">⏸</span>
                        自动运行
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑项目模态框 -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加新项目</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="projectName">项目名称</label>
                    <input type="text" id="projectName" placeholder="输入项目名称" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription">项目描述</label>
                    <textarea id="projectDescription" placeholder="输入项目描述（可选）"></textarea>
                </div>
                <div class="form-group">
                    <label for="scrapingCode">采集代码</label>
                    <textarea id="scrapingCode" placeholder="输入JavaScript代码来采集页面内容" rows="20"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveProject" class="btn btn-primary">保存项目</button>
                <button id="cancelProject" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
