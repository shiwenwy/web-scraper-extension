<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#fff" stroke-width="4"/>
  
  <!-- 蜘蛛网图标 -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <!-- 外圈 -->
    <circle cx="64" cy="64" r="45"/>
    <circle cx="64" cy="64" r="30"/>
    <circle cx="64" cy="64" r="15"/>
    
    <!-- 放射线 -->
    <line x1="64" y1="19" x2="64" y2="109"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(45 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(90 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(135 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(180 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(225 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(270 64 64)"/>
    <line x1="64" y1="19" x2="64" y2="109" transform="rotate(315 64 64)"/>
  </g>
  
  <!-- 中心蜘蛛 -->
  <circle cx="64" cy="64" r="8" fill="#fff"/>
  <circle cx="60" cy="60" r="2" fill="#667eea"/>
  <circle cx="68" cy="60" r="2" fill="#667eea"/>
  
  <!-- 数据点 -->
  <circle cx="40" cy="40" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="88" cy="40" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="40" cy="88" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="88" cy="88" r="3" fill="#fff" opacity="0.8"/>
</svg>
